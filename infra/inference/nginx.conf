# Install on the inference host after provisioning valid TLS certificates.
# Expose only the authenticated chat path, never vLLM's other service endpoints.
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/wonder/tls/fullchain.pem;
    ssl_certificate_key /etc/wonder/tls/privkey.pem;
    access_log off;
    client_max_body_size 64k;
    location = /v1/chat/completions {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_read_timeout 25s;
        proxy_buffering off;
    }
    location / { return 404; }
}
