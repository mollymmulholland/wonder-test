<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Wonder | MVP Preview</title>
  <meta name="description" content="Wonder MVP preview — begin with being understood." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Libre+Caslon+Display&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#1d1b18;--paper:#f4f0e8;--muted:#746d63;--line:rgba(29,27,24,.16);--soft:rgba(255,255,255,.42);--gold:#b98a5b;--danger:#8d3b2f}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif}body{font-weight:300}.shell{min-height:100svh;padding:96px 6vw 64px}.topbar{position:fixed;left:0;right:0;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:22px 6vw;background:linear-gradient(180deg,var(--paper),rgba(244,240,232,.72),transparent);pointer-events:none}.wordmark{font-family:'Libre Caslon Display',serif;letter-spacing:.27em;font-size:19px}.phase{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}.wrap{width:min(1060px,100%);margin:0 auto}.narrow{width:min(760px,100%);margin:0 auto}.eyebrow{font-size:11px;letter-spacing:.19em;text-transform:uppercase;color:var(--muted);margin:0 0 22px}h1,h2,h3{font-family:'Libre Caslon Display',serif;font-weight:400;margin:0}h1{font-size:clamp(58px,9vw,118px);line-height:.92;letter-spacing:-.04em;margin-bottom:28px}h2{font-size:clamp(42px,6vw,76px);line-height:1;margin-bottom:22px}h3{font-size:clamp(30px,4vw,46px);line-height:1.05;margin-bottom:12px}.lede{font-size:clamp(18px,2vw,24px);line-height:1.55;max-width:740px;color:#514b43;margin:0 0 38px}.muted{color:var(--muted);line-height:1.65}.card{border:1px solid var(--line);background:rgba(255,255,255,.22);padding:clamp(24px,5vw,48px)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.full{grid-column:1/-1}label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}input,select,textarea{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;color:var(--ink);padding:14px 0;font:inherit;outline:none}textarea{min-height:112px;line-height:1.5}.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:34px}.between{justify-content:space-between}.primary,.ghost,.quiet{appearance:none;border-radius:999px;padding:15px 22px;font:600 11px 'DM Sans',sans-serif;text-transform:uppercase;letter-spacing:.13em;cursor:pointer;touch-action:manipulation}.primary{border:1px solid var(--ink);background:var(--ink);color:var(--paper)}.ghost{border:1px solid var(--line);background:transparent;color:var(--ink)}.quiet{border:0;background:transparent;color:var(--muted);padding-left:0}.primary:disabled,.ghost:disabled{opacity:.45;cursor:not-allowed}.status{margin-top:18px;color:var(--muted);line-height:1.55}.error{color:var(--danger)}.progress{height:1px;background:var(--line);margin:0 0 46px}.progress span{display:block;height:1px;background:var(--ink);width:4%;transition:width .25s ease}.question{max-width:820px}.question-title{font-family:'Libre Caslon Display',serif;font-size:clamp(38px,6vw,68px);line-height:1.03;letter-spacing:-.02em;margin:0 0 30px}.options{display:grid;gap:12px}.option{width:100%;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.24);padding:18px 20px;text-align:left;font:400 16px/1.45 'DM Sans',sans-serif;color:var(--ink);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:rgba(0,0,0,.06)}.option.selected{border-color:var(--ink);background:rgba(255,255,255,.52);box-shadow:0 10px 30px rgba(0,0,0,.04)}.scale{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.scale .option{text-align:center;border-radius:999px;aspect-ratio:1;padding:0;display:grid;place-items:center}.rank-list{display:flex;flex-wrap:wrap;gap:8px;margin:-10px 0 18px}.rank-list span{border:1px solid var(--line);border-radius:999px;padding:8px 10px;font-size:12px;color:var(--muted)}.mirror-grid,.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:34px}.mirror-grid article,.tile,.match-card{border:1px solid var(--line);padding:26px;background:rgba(255,255,255,.18)}.mirror-grid span,.tile span,.match-card span{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}.mirror-grid p,.match-card p{line-height:1.65;color:#514b43}.rating{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.rate{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:transparent;cursor:pointer}.rate.selected{background:var(--ink);color:var(--paper);border-color:var(--ink)}.tile{min-height:170px;text-align:left;color:inherit;cursor:pointer}.tile strong{font-family:'Libre Caslon Display',serif;font-size:30px;font-weight:400;line-height:1.05}.pill-row{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.pill{border:1px solid var(--line);border-radius:999px;padding:8px 11px;font-size:12px;color:var(--muted)}.spinner{width:54px;height:54px;border:1px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:spin 1s linear infinite;margin:0 0 22px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:800px){.shell{padding:90px 5vw 54px}.topbar{padding:18px 5vw}.phase{display:none}.grid,.mirror-grid,.home-grid{grid-template-columns:1fr}.card{padding:24px}.actions.between{justify-content:flex-start}.scale{gap:6px}.scale .option{font-size:14px}.option{font-size:16px;padding:16px}.tile{min-height:145px}}
  </style>
</head>
<body>
  <header class="topbar"><div class="wordmark">WONDER</div><div class="phase" id="phase">Private preview</div></header>
  <main class="shell"><div id="app" class="wrap"></div></main>
  <script src="app.js"></script>
</body>
</html>
